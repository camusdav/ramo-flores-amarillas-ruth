<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ruth ❤️ De David</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 25%, #1a0a2e 50%, #2d1b4e 75%, #1a0a2e 100%);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            font-family: 'Georgia', serif;
            width: 100vw;
            height: 100vh;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #canvas3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: grab;
        }

        #canvas3d:active {
            cursor: grabbing;
        }

        /* Hearts and flowers rain container */
        .rain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            overflow: hidden;
        }

        .falling-item {
            position: absolute;
            top: -60px;
            animation: fall linear infinite;
            pointer-events: none;
            filter: drop-shadow(0 0 3px rgba(255,255,255,0.3));
        }

        @keyframes fall {
            0% {
                transform: translateY(-60px) rotate(0deg) scale(1);
                opacity: 0;
            }
            5% {
                opacity: 1;
            }
            50% {
                opacity: 0.9;
            }
            95% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(0.5);
                opacity: 0;
            }
        }

        @keyframes sway {
            0%, 100% { transform: translateX(0px); }
            25% { transform: translateX(30px); }
            75% { transform: translateX(-30px); }
        }

        .heart {
            font-size: 24px;
        }

        .flower-emoji {
            font-size: 22px;
        }

        /* Title overlay */
        .title-overlay {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 20;
            pointer-events: none;
        }

        .title-overlay h1 {
            font-family: 'Brush Script MT', 'Segoe Script', cursive;
            font-size: 2.5em;
            color: #ffd700;
            text-shadow: 
                0 0 10px rgba(255, 215, 0, 0.7),
                0 0 20px rgba(255, 215, 0, 0.5),
                0 0 40px rgba(255, 215, 0, 0.3),
                2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 3px;
            animation: titleGlow 3s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { 
                text-shadow: 
                    0 0 10px rgba(255, 215, 0, 0.7),
                    0 0 20px rgba(255, 215, 0, 0.5),
                    0 0 40px rgba(255, 215, 0, 0.3),
                    2px 2px 4px rgba(0,0,0,0.5);
            }
            50% { 
                text-shadow: 
                    0 0 20px rgba(255, 215, 0, 0.9),
                    0 0 40px rgba(255, 215, 0, 0.7),
                    0 0 60px rgba(255, 215, 0, 0.5),
                    2px 2px 4px rgba(0,0,0,0.5);
            }
        }

        .instruction {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 20;
            pointer-events: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85em;
            font-style: italic;
        }

        /* Sparkle particles */
        .sparkle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: #ffd700;
            border-radius: 50%;
            pointer-events: none;
            z-index: 6;
            animation: sparkle 2s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="title-overlay">
        <h1>✨ Para Ruth, con todo mi amor ✨</h1>
    </div>

    <div class="rain-container" id="rainContainer"></div>

    <canvas id="canvas3d"></canvas>

    <div class="instruction">🌻 Arrastra para girar el ramo 🌻</div>

    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ============================================================
        // RAIN OF HEARTS AND FLOWERS
        // ============================================================
        const rainContainer = document.getElementById('rainContainer');
        const heartColors = ['❤️', '💜', '💗', '💖', '💕', '🩷', '❣️'];
        const flowers = ['🌻', '🌼', '💛'];

        function createFallingItem() {
            const item = document.createElement('div');
            item.classList.add('falling-item');
            
            const isHeart = Math.random() > 0.3;
            if (isHeart) {
                item.classList.add('heart');
                item.textContent = heartColors[Math.floor(Math.random() * heartColors.length)];
            } else {
                item.classList.add('flower-emoji');
                item.textContent = flowers[Math.floor(Math.random() * flowers.length)];
            }

            item.style.left = Math.random() * 100 + '%';
            item.style.fontSize = (Math.random() * 20 + 14) + 'px';
            
            const duration = Math.random() * 6 + 5;
            item.style.animationDuration = duration + 's';
            item.style.animationDelay = Math.random() * 3 + 's';
            item.style.opacity = Math.random() * 0.5 + 0.5;

            rainContainer.appendChild(item);

            setTimeout(() => {
                if (item.parentNode) {
                    item.parentNode.removeChild(item);
                }
            }, (duration + 4) * 1000);
        }

        // Create initial batch
        for (let i = 0; i < 30; i++) {
            setTimeout(createFallingItem, i * 200);
        }

        // Keep creating
        setInterval(createFallingItem, 300);

        // ============================================================
        // THREE.JS 3D BOUQUET
        // ============================================================
        const canvas = document.getElementById('canvas3d');
        const renderer = new THREE.WebGLRenderer({ 
            canvas, 
            antialias: true, 
            alpha: true 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 2, 8);
        camera.lookAt(0, 1.5, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
        mainLight.position.set(5, 8, 5);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0xe6e0ff, 0.4);
        fillLight.position.set(-3, 4, -2);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xffd700, 0.3);
        rimLight.position.set(0, 2, -5);
        scene.add(rimLight);

        const pointLight = new THREE.PointLight(0xffa500, 0.5, 15);
        pointLight.position.set(0, 5, 3);
        scene.add(pointLight);

        // Bouquet group
        const bouquetGroup = new THREE.Group();
        scene.add(bouquetGroup);

        // ============================================================
        // MATERIALS
        // ============================================================
        const petalMaterial = new THREE.MeshStandardMaterial({
            color: 0xffc107,
            roughness: 0.6,
            metalness: 0.05,
            side: THREE.DoubleSide,
            emissive: 0x332200,
            emissiveIntensity: 0.1
        });

        const petalTipMaterial = new THREE.MeshStandardMaterial({
            color: 0xffeb3b,
            roughness: 0.5,
            metalness: 0.05,
            side: THREE.DoubleSide,
            emissive: 0x443300,
            emissiveIntensity: 0.1
        });

        const centerMaterial = new THREE.MeshStandardMaterial({
            color: 0x3e2723,
            roughness: 0.9,
            metalness: 0.0,
        });

        const centerRingMaterial = new THREE.MeshStandardMaterial({
            color: 0x5d4037,
            roughness: 0.8,
            metalness: 0.0,
        });

        const stemMaterial = new THREE.MeshStandardMaterial({
            color: 0x2e7d32,
            roughness: 0.7,
            metalness: 0.05,
        });

        const leafMaterial = new THREE.MeshStandardMaterial({
            color: 0x388e3c,
            roughness: 0.6,
            metalness: 0.05,
            side: THREE.DoubleSide,
        });

        const darkLeafMaterial = new THREE.MeshStandardMaterial({
            color: 0x1b5e20,
            roughness: 0.7,
            metalness: 0.05,
            side: THREE.DoubleSide,
        });

        const wrapperMaterial = new THREE.MeshStandardMaterial({
            color: 0xfff8e1,
            roughness: 0.4,
            metalness: 0.05,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.92,
        });

        const wrapperMaterial2 = new THREE.MeshStandardMaterial({
            color: 0xfffde7,
            roughness: 0.35,
            metalness: 0.05,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.85,
        });

        const ribbonMaterial = new THREE.MeshStandardMaterial({
            color: 0xf9a825,
            roughness: 0.3,
            metalness: 0.15,
        });

        const tagMaterial = new THREE.MeshStandardMaterial({
            color: 0xa5d6a7,
            roughness: 0.5,
            metalness: 0.05,
        });

        // ============================================================
        // CREATE SUNFLOWER
        // ============================================================
        function createSunflower(x, y, z, scale, rotX, rotY, rotZ) {
            const flowerGroup = new THREE.Group();

            // Center disc
            const centerGeo = new THREE.SphereGeometry(0.28 * scale, 24, 16);
            const center = new THREE.Mesh(centerGeo, centerMaterial);
            center.scale.set(1, 1, 0.5);
            flowerGroup.add(center);

            // Center ring (lighter ring around center)
            const ringGeo = new THREE.TorusGeometry(0.22 * scale, 0.06 * scale, 8, 24);
            const ring = new THREE.Mesh(ringGeo, centerRingMaterial);
            ring.position.z = 0.02;
            flowerGroup.add(ring);

            // Center seeds texture (small bumps)
            for (let i = 0; i < 20; i++) {
                const angle = (i / 20) * Math.PI * 2;
                const r = 0.12 * scale * Math.random();
                const seedGeo = new THREE.SphereGeometry(0.025 * scale, 6, 4);
                const seed = new THREE.Mesh(seedGeo, centerRingMaterial);
                seed.position.set(
                    Math.cos(angle) * r,
                    Math.sin(angle) * r,
                    0.12 * scale
                );
                flowerGroup.add(seed);
            }

            // Petals - two layers for fullness
            const petalCount = 16;
            for (let layer = 0; layer < 2; layer++) {
                for (let i = 0; i < petalCount; i++) {
                    const angle = (i / petalCount) * Math.PI * 2 + (layer * Math.PI / petalCount);
                    
                    // Custom petal shape
                    const petalShape = new THREE.Shape();
                    const pw = 0.12 * scale;
                    const pl = 0.4 * scale * (layer === 0 ? 1 : 0.85);
                    
                    petalShape.moveTo(0, 0);
                    petalShape.bezierCurveTo(pw, pl * 0.3, pw * 0.9, pl * 0.7, pw * 0.3, pl);
                    petalShape.bezierCurveTo(0, pl * 1.05, 0, pl * 1.05, -pw * 0.3, pl);
                    petalShape.bezierCurveTo(-pw * 0.9, pl * 0.7, -pw, pl * 0.3, 0, 0);

                    const extrudeSettings = {
                        steps: 1,
                        depth: 0.015 * scale,
                        bevelEnabled: true,
                        bevelThickness: 0.005 * scale,
                        bevelSize: 0.005 * scale,
                        bevelSegments: 2
                    };

                    const petalGeo = new THREE.ExtrudeGeometry(petalShape, extrudeSettings);
                    const mat = layer === 0 ? petalMaterial : petalTipMaterial;
                    const petal = new THREE.Mesh(petalGeo, mat);
                    
                    petal.position.set(
                        Math.cos(angle) * 0.2 * scale,
                        Math.sin(angle) * 0.2 * scale,
                        -0.02 * layer
                    );
                    petal.rotation.z = angle - Math.PI / 2;
                    
                    // Tilt petals slightly outward
                    const tiltAxis = new THREE.Vector3(Math.cos(angle + Math.PI/2), Math.sin(angle + Math.PI/2), 0);
                    petal.rotateOnAxis(tiltAxis, (0.15 + layer * 0.2 + Math.random() * 0.1));
                    
                    flowerGroup.add(petal);
                }
            }

            // Small green sepals behind petals
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2 + 0.2;
                const sepalShape = new THREE.Shape();
                const sw = 0.06 * scale;
                const sl = 0.2 * scale;
                
                sepalShape.moveTo(0, 0);
                sepalShape.bezierCurveTo(sw, sl * 0.4, sw * 0.5, sl * 0.8, 0, sl);
                sepalShape.bezierCurveTo(-sw * 0.5, sl * 0.8, -sw, sl * 0.4, 0, 0);

                const sepalGeo = new THREE.ExtrudeGeometry(sepalShape, {
                    steps: 1,
                    depth: 0.01 * scale,
                    bevelEnabled: false
                });

                const sepal = new THREE.Mesh(sepalGeo, leafMaterial);
                sepal.position.set(
                    Math.cos(angle) * 0.25 * scale,
                    Math.sin(angle) * 0.25 * scale,
                    -0.08
                );
                sepal.rotation.z = angle - Math.PI / 2;
                const tiltAxis2 = new THREE.Vector3(Math.cos(angle + Math.PI/2), Math.sin(angle + Math.PI/2), 0);
                sepal.rotateOnAxis(tiltAxis2, 0.5);
                flowerGroup.add(sepal);
            }

            flowerGroup.position.set(x, y, z);
            flowerGroup.rotation.set(rotX, rotY, rotZ);

            return flowerGroup;
        }

        // ============================================================
        // CREATE STEMS
        // ============================================================
        function createStem(startX, startY, startZ, endX, endY, endZ) {
            const curve = new THREE.QuadraticBezierCurve3(
                new THREE.Vector3(startX, startY, startZ),
                new THREE.Vector3(
                    (startX + endX) / 2 + (Math.random() - 0.5) * 0.3,
                    (startY + endY) / 2,
                    (startZ + endZ) / 2 + (Math.random() - 0.5) * 0.2
                ),
                new THREE.Vector3(endX, endY, endZ)
            );

            const tubeGeo = new THREE.TubeGeometry(curve, 12, 0.04, 8, false);
            const stem = new THREE.Mesh(tubeGeo, stemMaterial);
            return stem;
        }

        // ============================================================
        // CREATE LEAF
        // ============================================================
        function createLeaf(x, y, z, rotZ, scale, material) {
            const leafShape = new THREE.Shape();
            const lw = 0.15 * scale;
            const ll = 0.5 * scale;
            
            leafShape.moveTo(0, 0);
            leafShape.bezierCurveTo(lw * 1.5, ll * 0.3, lw * 1.2, ll * 0.6, 0.02, ll);
            leafShape.bezierCurveTo(-lw * 1.2, ll * 0.6, -lw * 1.5, ll * 0.3, 0, 0);

            const leafGeo = new THREE.ExtrudeGeometry(leafShape, {
                steps: 1,
                depth: 0.01,
                bevelEnabled: true,
                bevelThickness: 0.005,
                bevelSize: 0.005,
                bevelSegments: 1
            });

            const leaf = new THREE.Mesh(leafGeo, material || leafMaterial);
            leaf.position.set(x, y, z);
            leaf.rotation.z = rotZ;
            return leaf;
        }

        // ============================================================
        // CREATE WRAPPER
        // ============================================================
        function createWrapper() {
            const wrapperGroup = new THREE.Group();

            // Main cone-like wrapper
            const wrapperPoints = [];
            for (let i = 0; i < 12; i++) {
                const t = i / 11;
                const r = 0.15 + t * 1.2;
                const y = t * 2.5 - 0.5;
                wrapperPoints.push(new THREE.Vector2(r, y));
            }

            const wrapperGeo = new THREE.LatheGeometry(wrapperPoints, 32);
            const wrapper = new THREE.Mesh(wrapperGeo, wrapperMaterial);
            wrapper.position.y = -0.3;
            wrapper.scale.set(1, 0.7, 1);
            wrapperGroup.add(wrapper);

            // Wrapper flaps (folded edges that extend upward)
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2 + 0.3;
                
                const flapShape = new THREE.Shape();
                flapShape.moveTo(-0.4, 0);
                flapShape.bezierCurveTo(-0.35, 0.6, -0.1, 1.2, 0.05, 1.5);
                flapShape.bezierCurveTo(0.2, 1.2, 0.35, 0.6, 0.4, 0);
                flapShape.lineTo(-0.4, 0);

                const flapGeo = new THREE.ExtrudeGeometry(flapShape, {
                    steps: 1,
                    depth: 0.01,
                    bevelEnabled: true,
                    bevelThickness: 0.005,
                    bevelSize: 0.01,
                    bevelSegments: 2
                });

                const mat = i % 2 === 0 ? wrapperMaterial : wrapperMaterial2;
                const flap = new THREE.Mesh(flapGeo, mat);
                
                const flapR = 1.1 + Math.random() * 0.2;
                flap.position.set(
                    Math.cos(angle) * flapR,
                    1.2 + Math.random() * 0.3,
                    Math.sin(angle) * flapR
                );
                
                flap.rotation.y = -angle;
                flap.rotation.x = -0.3 - Math.random() * 0.3;
                flap.rotation.z = (Math.random() - 0.5) * 0.3;
                
                wrapperGroup.add(flap);
            }

            // Inner tissue/tulle wrap
            for (let i = 0; i < 4; i++) {
                const angle = (i / 4) * Math.PI * 2 + 0.8;
                
                const tissueShape = new THREE.Shape();
                tissueShape.moveTo(-0.3, 0);
                tissueShape.bezierCurveTo(-0.25, 0.4, -0.05, 0.9, 0.05, 1.1);
                tissueShape.bezierCurveTo(0.15, 0.9, 0.25, 0.4, 0.3, 0);

                const tissueGeo = new THREE.ExtrudeGeometry(tissueShape, {
                    steps: 1,
                    depth: 0.005,
                    bevelEnabled: false
                });

                const tissueMat = new THREE.MeshStandardMaterial({
                    color: 0xe8f5e9,
                    roughness: 0.3,
                    metalness: 0.0,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.5,
                });

                const tissue = new THREE.Mesh(tissueGeo, tissueMat);
                const tissueR = 0.9;
                tissue.position.set(
                    Math.cos(angle) * tissueR,
                    1.4,
                    Math.sin(angle) * tissueR
                );
                tissue.rotation.y = -angle;
                tissue.rotation.x = -0.2;
                wrapperGroup.add(tissue);
            }

            return wrapperGroup;
        }

        // ============================================================
        // CREATE RIBBON
        // ============================================================
        function createRibbon() {
            const ribbonGroup = new THREE.Group();

            // Main ribbon wrap (torus around the stem)
            const torusGeo = new THREE.TorusGeometry(0.35, 0.06, 8, 32);
            const torus = new THREE.Mesh(torusGeo, ribbonMaterial);
            torus.position.y = 0.5;
            torus.rotation.x = Math.PI / 2;
            ribbonGroup.add(torus);

            // Second wrap
            const torusGeo2 = new THREE.TorusGeometry(0.32, 0.05, 8, 32);
            const torus2 = new THREE.Mesh(torusGeo2, ribbonMaterial);
            torus2.position.y = 0.35;
            torus2.rotation.x = Math.PI / 2;
            ribbonGroup.add(torus2);

            // Bow loops
            for (let side = -1; side <= 1; side += 2) {
                const bowCurve = new THREE.CubicBezierCurve3(
                    new THREE.Vector3(0, 0.5, 0.35),
                    new THREE.Vector3(side * 0.5, 0.8, 0.4),
                    new THREE.Vector3(side * 0.5, 0.2, 0.4),
                    new THREE.Vector3(0, 0.5, 0.35)
                );
                const bowGeo = new THREE.TubeGeometry(bowCurve, 20, 0.035, 8, false);
                const bow = new THREE.Mesh(bowGeo, ribbonMaterial);
                ribbonGroup.add(bow);
            }

            // Ribbon tails hanging down
            for (let side = -1; side <= 1; side += 2) {
                const tailCurve = new THREE.CubicBezierCurve3(
                    new THREE.Vector3(0, 0.4, 0.35),
                    new THREE.Vector3(side * 0.15, 0.1, 0.38),
                    new THREE.Vector3(side * 0.25, -0.2, 0.32),
                    new THREE.Vector3(side * 0.2, -0.5, 0.35)
                );
                const tailGeo = new THREE.TubeGeometry(tailCurve, 12, 0.03, 6, false);
                const tail = new THREE.Mesh(tailGeo, ribbonMaterial);
                ribbonGroup.add(tail);
            }

            return ribbonGroup;
        }

        // ============================================================
        // CREATE TAG / CARD
        // ============================================================
        function createTag() {
            const tagGroup = new THREE.Group();

            // Tag card
            const tagShape = new THREE.Shape();
            const tw = 0.4;
            const th = 0.6;
            const cornerR = 0.05;

            tagShape.moveTo(-tw + cornerR, -th);
            tagShape.lineTo(tw - cornerR, -th);
            tagShape.quadraticCurveTo(tw, -th, tw, -th + cornerR);
            tagShape.lineTo(tw, th - cornerR);
            tagShape.quadraticCurveTo(tw, th, tw - cornerR, th);
            tagShape.lineTo(-tw + cornerR, th);
            tagShape.quadraticCurveTo(-tw, th, -tw, th - cornerR);
            tagShape.lineTo(-tw, -th + cornerR);
            tagShape.quadraticCurveTo(-tw, -th, -tw + cornerR, -th);

            const tagGeo = new THREE.ExtrudeGeometry(tagShape, {
                steps: 1,
                depth: 0.02,
                bevelEnabled: true,
                bevelThickness: 0.005,
                bevelSize: 0.005,
                bevelSegments: 2
            });

            const tag = new THREE.Mesh(tagGeo, tagMaterial);
            tagGroup.add(tag);

            // Tag hole
            const holeGeo = new THREE.TorusGeometry(0.04, 0.01, 6, 16);
            const holeMat = new THREE.MeshStandardMaterial({ color: 0x795548, roughness: 0.8 });
            const hole = new THREE.Mesh(holeGeo, holeMat);
            hole.position.set(0, th - 0.1, 0.03);
            tagGroup.add(hole);

            // Text using canvas texture
            const textCanvas = document.createElement('canvas');
            textCanvas.width = 256;
            textCanvas.height = 384;
            const ctx = textCanvas.getContext('2d');
            
            // Transparent background
            ctx.clearRect(0, 0, 256, 384);
            
            // "Para" text
            ctx.fillStyle = '#2e7d32';
            ctx.font = 'italic bold 30px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.fillText('Para', 128, 130);
            
            // "Ruth" text (bigger, decorative)
            ctx.font = 'bold 52px "Brush Script MT", "Segoe Script", cursive';
            ctx.fillStyle = '#1b5e20';
            ctx.fillText('Ruth', 128, 195);
            
            // Heart
            ctx.font = '30px Arial';
            ctx.fillStyle = '#e53935';
            ctx.fillText('❤', 128, 240);
            
            // "de David" text
            ctx.font = 'italic 28px Georgia, serif';
            ctx.fillStyle = '#2e7d32';
            ctx.fillText('de David', 128, 285);

            // Small sunflower decoration
            ctx.font = '22px Arial';
            ctx.fillText('🌻', 128, 325);

            const textTexture = new THREE.CanvasTexture(textCanvas);
            textTexture.needsUpdate = true;

            const textPlaneGeo = new THREE.PlaneGeometry(tw * 2 - 0.05, th * 2 - 0.05);
            const textPlaneMat = new THREE.MeshBasicMaterial({
                map: textTexture,
                transparent: true,
                side: THREE.DoubleSide,
            });
            const textPlane = new THREE.Mesh(textPlaneGeo, textPlaneMat);
            textPlane.position.z = 0.035;
            tagGroup.add(textPlane);

            // String connecting tag to ribbon
            const stringCurve = new THREE.CubicBezierCurve3(
                new THREE.Vector3(0, th - 0.1, 0),
                new THREE.Vector3(0.1, th + 0.3, 0.1),
                new THREE.Vector3(-0.05, th + 0.5, 0.2),
                new THREE.Vector3(0, th + 0.7, 0.3)
            );
            const stringGeo = new THREE.TubeGeometry(stringCurve, 12, 0.008, 6, false);
            const stringMat = new THREE.MeshStandardMaterial({ color: 0xf9a825, roughness: 0.5 });
            const string = new THREE.Mesh(stringGeo, stringMat);
            tagGroup.add(string);

            tagGroup.position.set(0.3, -0.35, 0.5);
            tagGroup.rotation.set(0, 0.2, -0.15);

            return tagGroup;
        }

        // ============================================================
        // ASSEMBLE THE BOUQUET
        // ============================================================

        // Flower positions (arranged like in the image - clustered at top)
        const flowerPositions = [
            // Top layer
            { x: 0, y: 3.6, z: 0.3, scale: 1.1, rx: -0.3, ry: 0, rz: 0 },
            { x: 0.7, y: 3.3, z: 0.2, scale: 1.0, rx: -0.2, ry: 0.3, rz: 0.1 },
            { x: -0.7, y: 3.4, z: 0.1, scale: 0.95, rx: -0.2, ry: -0.3, rz: -0.1 },
            { x: 0.4, y: 3.7, z: -0.2, scale: 0.9, rx: -0.4, ry: 0.1, rz: 0.05 },
            { x: -0.4, y: 3.65, z: -0.3, scale: 0.85, rx: -0.5, ry: -0.1, rz: -0.05 },
            
            // Middle layer
            { x: 1.0, y: 3.0, z: 0.5, scale: 1.0, rx: 0.0, ry: 0.5, rz: 0.2 },
            { x: -1.0, y: 3.1, z: 0.4, scale: 0.95, rx: 0.0, ry: -0.5, rz: -0.2 },
            { x: 0.3, y: 2.9, z: 0.7, scale: 0.9, rx: 0.3, ry: 0.2, rz: 0.1 },
            { x: -0.3, y: 2.95, z: 0.6, scale: 0.9, rx: 0.2, ry: -0.2, rz: -0.1 },
            
            // Outer flowers
            { x: 0.9, y: 3.5, z: -0.4, scale: 0.8, rx: -0.5, ry: 0.4, rz: 0.15 },
            { x: -0.8, y: 3.0, z: -0.5, scale: 0.75, rx: -0.6, ry: -0.4, rz: -0.15 },
        ];

        // Create flowers
        flowerPositions.forEach(pos => {
            const flower = createSunflower(pos.x, pos.y, pos.z, pos.scale, pos.rx, pos.ry, pos.rz);
            bouquetGroup.add(flower);

            // Stem
            const stem = createStem(pos.x, pos.y - 0.3, pos.z, pos.x * 0.15, -0.3, pos.z * 0.1);
            bouquetGroup.add(stem);
        });

        // Foliage / green leaves scattered around
        const foliagePositions = [
            { x: 0.5, y: 2.8, z: 0.8, rz: 0.5, s: 1.0 },
            { x: -0.6, y: 2.7, z: 0.7, rz: -0.6, s: 0.9 },
            { x: 0.9, y: 2.5, z: 0.3, rz: 0.8, s: 0.85 },
            { x: -0.9, y: 2.6, z: 0.4, rz: -0.7, s: 0.9 },
            { x: 0.3, y: 3.2, z: 0.9, rz: 0.3, s: 0.7 },
            { x: -0.4, y: 3.3, z: 0.85, rz: -0.4, s: 0.75 },
            { x: 1.1, y: 2.8, z: -0.1, rz: 1.0, s: 0.8 },
            { x: -1.1, y: 2.9, z: -0.2, rz: -1.0, s: 0.85 },
            { x: 0.7, y: 3.6, z: -0.5, rz: 0.7, s: 0.6 },
            { x: -0.7, y: 3.5, z: -0.4, rz: -0.8, s: 0.65 },
            { x: 0, y: 2.6, z: 0.9, rz: 0, s: 0.9 },
            { x: 0.2, y: 2.4, z: 0.6, rz: 0.2, s: 1.0 },
            { x: -0.2, y: 2.45, z: 0.65, rz: -0.3, s: 0.95 },
            // Small sprigs
            { x: 0.6, y: 3.8, z: 0.1, rz: 0.4, s: 0.5 },
            { x: -0.5, y: 3.7, z: 0.15, rz: -0.5, s: 0.5 },
            { x: 1.2, y: 3.2, z: 0.2, rz: 0.9, s: 0.55 },
            { x: -1.15, y: 3.15, z: 0.15, rz: -0.85, s: 0.55 },
        ];

        foliagePositions.forEach((pos, i) => {
            const mat = i % 3 === 0 ? darkLeafMaterial : leafMaterial;
            const leaf = createLeaf(pos.x, pos.y, pos.z, pos.rz, pos.s, mat);
            leaf.rotation.x = (Math.random() - 0.5) * 0.5;
            leaf.rotation.y = (Math.random() - 0.5) * 0.8;
            bouquetGroup.add(leaf);
        });

        // Small leaf clusters (tiny leaves for density)
        for (let i = 0; i < 25; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = 0.5 + Math.random() * 0.8;
            const y = 2.3 + Math.random() * 1.5;
            const smallLeaf = createLeaf(
                Math.cos(angle) * r,
                y,
                Math.sin(angle) * r * 0.6 + 0.2,
                angle + Math.PI / 2,
                0.3 + Math.random() * 0.3,
                Math.random() > 0.5 ? leafMaterial : darkLeafMaterial
            );
            smallLeaf.rotation.x = (Math.random() - 0.5) * 0.6;
            bouquetGroup.add(smallLeaf);
        }

        // Add wrapper
        const wrapper = createWrapper();
        bouquetGroup.add(wrapper);

        // Add ribbon
        const ribbon = createRibbon();
        bouquetGroup.add(ribbon);

        // Add tag
        const tag = createTag();
        bouquetGroup.add(tag);

        // Main stem visible below wrapper
        const mainStemCurve = new THREE.CubicBezierCurve3(
            new THREE.Vector3(0, -0.5, 0.15),
            new THREE.Vector3(0, -0.8, 0.12),
            new THREE.Vector3(0, -1.1, 0.08),
            new THREE.Vector3(0, -1.4, 0.15)
        );
        const mainStemGeo = new THREE.TubeGeometry(mainStemCurve, 12, 0.12, 8, false);
        const mainStem = new THREE.Mesh(mainStemGeo, wrapperMaterial);
        bouquetGroup.add(mainStem);

        // Bottom of the wrapper (gathered)
        const bottomGeo = new THREE.SphereGeometry(0.2, 16, 8);
        const bottom = new THREE.Mesh(bottomGeo, wrapperMaterial);
        bottom.position.set(0, -1.4, 0.15);
        bottom.scale.set(1, 1.5, 1);
        bouquetGroup.add(bottom);

        // Position the entire bouquet
        bouquetGroup.position.y = -1.0;

        // ============================================================
        // FLOATING PARTICLES (golden sparkles around bouquet)
        // ============================================================
        const particleCount = 50;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleSizes = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = 1.5 + Math.random() * 2;
            particlePositions[i * 3] = Math.cos(angle) * r;
            particlePositions[i * 3 + 1] = Math.random() * 5 - 1;
            particlePositions[i * 3 + 2] = Math.sin(angle) * r;
            particleSizes[i] = Math.random() * 3 + 1;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particleGeo.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));

        const particleMat = new THREE.PointsMaterial({
            color: 0xffd700,
            size: 0.05,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending,
        });

        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // ============================================================
        // MOUSE / TOUCH INTERACTION
        // ============================================================
        let isDragging = false;
        let previousMouseX = 0;
        let previousMouseY = 0;
        let targetRotationY = 0;
        let currentRotationY = 0;
        let autoRotate = true;
        let autoRotateSpeed = 0.003;
        let autoRotateTimeout;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            autoRotate = false;
            previousMouseX = e.clientX;
            previousMouseY = e.clientY;
            clearTimeout(autoRotateTimeout);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMouseX;
            targetRotationY += deltaX * 0.008;
            previousMouseX = e.clientX;
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            // Resume auto-rotation after 3 seconds of no interaction
            autoRotateTimeout = setTimeout(() => {
                autoRotate = true;
            }, 3000);
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
        });

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            autoRotate = false;
            previousMouseX = e.touches[0].clientX;
            clearTimeout(autoRotateTimeout);
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const deltaX = e.touches[0].clientX - previousMouseX;
            targetRotationY += deltaX * 0.008;
            previousMouseX = e.touches[0].clientX;
        }, { passive: true });

        canvas.addEventListener('touchend', () => {
            isDragging = false;
            autoRotateTimeout = setTimeout(() => {
                autoRotate = true;
            }, 3000);
        });

        // ============================================================
        // ANIMATION LOOP
        // ============================================================
        const clock = new THREE.Clock();
        let autoAngle = 0;

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = clock.getElapsedTime();

            // Auto-rotation (slow oscillation ±90° = total 180°)
            if (autoRotate) {
                autoAngle += autoRotateSpeed;
                targetRotationY = Math.sin(autoAngle) * (Math.PI / 2);
            }

            // Smooth interpolation
            currentRotationY += (targetRotationY - currentRotationY) * 0.05;
            bouquetGroup.rotation.y = currentRotationY;

            // Gentle bobbing motion
            bouquetGroup.position.y = -1.0 + Math.sin(elapsed * 0.8) * 0.05;

            // Particle animation
            const positions = particles.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                positions[i * 3 + 1] += 0.005;
                if (positions[i * 3 + 1] > 5) {
                    positions[i * 3 + 1] = -1;
                }
                // Slight circular motion
                const idx = i * 3;
                const angle = elapsed * 0.5 + i;
                positions[idx] += Math.sin(angle) * 0.002;
                positions[idx + 2] += Math.cos(angle) * 0.002;
            }
            particles.geometry.attributes.position.needsUpdate = true;

            // Pulsing light
            pointLight.intensity = 0.5 + Math.sin(elapsed * 2) * 0.15;

            renderer.render(scene, camera);
        }

        animate();

        // ============================================================
        // RESIZE HANDLER
        // ============================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
